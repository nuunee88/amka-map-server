<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Улаанбаатарын байгуулагууд</title>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; }
#map { width: 100vw; height: 100vh; }
#status {
  position: absolute; top: 10px; left: 10px; z-index: 999;
  background: rgba(0,0,0,0.85); color: #0f0; font-family: monospace;
  font-size: 13px; padding: 12px 16px; border-radius: 6px; line-height: 1.8;
}
.maplibregl-popup-content { padding: 14px; border-radius: 8px; min-width: 220px; }
.popup-title { font-weight: 700; font-size: 15px; color: #1a1a2e; margin-bottom: 6px; border-bottom: 2px solid #f0a500; padding-bottom: 5px; }
.popup-cat { font-size: 11px; color: #888; margin-bottom: 6px; }
.popup-row { font-size: 12px; color: #555; margin: 3px 0; }
.popup-desc { font-size: 12px; color: #666; margin-top: 6px; font-style: italic; }
.popup-link { display: inline-block; margin-top: 8px; color: #1a73e8; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<div id="status">Эхэлж байна...</div>
<div id="map"></div>
<script>
var MARTIN = 'https://amka-map-server.onrender.com';
var map = null;
var steps = [];

function report(txt) {
  steps.push(txt);
  document.getElementById('status').innerHTML = steps.join('<br>');
}

report('1. Script ачаалагдсан');

map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [106.9057, 47.9184],
  zoom: 14
});

report('2. Map үүсгэсэн');

map.addControl(new maplibregl.NavigationControl(), 'top-right');

map.on('error', function(e) {
  report('ERROR: ' + (e.error ? e.error.message : 'unknown'));
});

map.on('load', function() {
  report('3. load event fired');

  map.addSource('places', {
    type: 'vector',
    url: MARTIN + '/places'
  });

  report('4. addSource дууссан');

  map.addLayer({
    id: 'places-circle',
    type: 'circle',
    source: 'places',
    'source-layer': 'places',
    paint: {
      'circle-radius': 11,
      'circle-color': [
        'match', ['get', 'category'],
        'university', '#1a73e8',
        'hospital', '#e53935',
        'school', '#43a047',
        'shop', '#fb8c00',
        '#888888'
      ],
      'circle-stroke-width': 2.5,
      'circle-stroke-color': '#ffffff'
    }
  });

  report('5. circle layer нэмэгдсэн');

  map.on('click', 'places-circle', function(e) {
    var p = e.features[0].properties;
    var cats = {
      'university': 'Их сургууль',
      'hospital': 'Эмнэлэг',
      'school': 'Дунд сургууль',
      'shop': 'Дэлгүүр'
    };
    var cat = cats[p.category] || p.category;
    var phone = p.phone ? '<div class="popup-row">Утас: ' + p.phone + '</div>' : '';
    var web = p.website ? '<a class="popup-link" href="' + p.website + '" target="_blank">Вэбсайт</a>' : '';
    var desc = p.description ? '<div class="popup-desc">' + p.description + '</div>' : '';

    new maplibregl.Popup({ maxWidth: '300px', offset: 15 })
      .setLngLat(e.lngLat)
      .setHTML(
        '<div class="popup-title">' + p.name + '</div>' +
        '<div class="popup-cat">' + cat + '</div>' +
        '<div class="popup-row">' + p.address + '</div>' +
        phone + desc + web
      )
      .addTo(map);
  });

  map.on('mouseenter', 'places-circle', function() {
    map.getCanvas().style.cursor = 'pointer';
  });

  map.on('mouseleave', 'places-circle', function() {
    map.getCanvas().style.cursor = '';
  });

  report('7. Event handler нэмэгдсэн');

  var checks = 0;
  var timer = setInterval(function() {
    checks++;
    var n = map.queryRenderedFeatures({ layers: ['places-circle'] }).length;
    report('8. Шалгалт ' + checks + ': Feature = ' + n);
    if (n > 0 || checks >= 20) {
      clearInterval(timer);
    }
  }, 1000);

});
</script>
</body>
</html>
