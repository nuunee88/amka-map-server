<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Улаанбаатарын Их Сургуулиуд</title>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .maplibregl-popup-content {
      padding: 16px;
      border-radius: 8px;
      min-width: 220px;
    }
    .popup-title {
      font-weight: 700;
      font-size: 15px;
      color: #1a1a2e;
      margin-bottom: 8px;
      border-bottom: 2px solid #f0a500;
      padding-bottom: 6px;
    }
    .popup-row {
      font-size: 13px;
      color: #555;
      margin: 4px 0;
    }
    .popup-link {
      display: inline-block;
      margin-top: 8px;
      color: #1a73e8;
      font-size: 13px;
      text-decoration: none;
    }
    .popup-link:hover { text-decoration: underline; }
    .popup-category {
  font-size: 11px;
  color: #888;
  margin-bottom: 6px;
}
.popup-desc {
  font-size: 12px;
  color: #666;
  margin-top: 6px;
  font-style: italic;
}
  </style>
</head>
<body>
<div id="map"></div>
<script>
  maplibregl.setRTLTextPlugin(
  'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
  null, true
);
const MARTIN_URL = 'https://amka-map-server.onrender.com';

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [106.917, 47.918],
  zoom: 12
});

map.addControl(new maplibregl.NavigationControl(), 'top-right');

map.on('load', () => {

  map.addSource('places', {
    type: 'vector',
    url: `${MARTIN_URL}/places`
  });

  // Өнгөний тохиргоо — категориор
  const categoryColors = {
    'university': '#1a73e8',
    'hospital':   '#e53935',
    'school':     '#43a047',
    'shop':       '#fb8c00'
  };

  // Тойрог давхарга
  map.addLayer({
    id: 'places-circle',
    type: 'circle',
    source: 'places',
    'source-layer': 'places',
    paint: {
      'circle-radius': 11,
      'circle-color': [
        'match', ['get', 'category'],
        'university', '#1a73e8',
        'hospital',   '#e53935',
        'school',     '#43a047',
        'shop',       '#fb8c00',
        '#888888'
      ],
      'circle-stroke-width': 2.5,
      'circle-stroke-color': '#ffffff',
      'circle-opacity': 0.9
    }
  });

  // Нэрийн давхарга
  map.addLayer({
    id: 'places-label',
    type: 'symbol',
    source: 'places',
    'source-layer': 'places',
    layout: {
      'text-field': ['get', 'name_short'],
      'text-size': 11,
      'text-offset': [0, 1.6],
      'text-anchor': 'top',
      'text-font': ['Noto Sans Regular']
    },
    paint: {
      'text-color': '#1a1a2e',
      'text-halo-color': '#ffffff',
      'text-halo-width': 2
    }
  });

  // Popup
  map.on('click', 'places-circle', (e) => {
    const p = e.features[0].properties;
    const categoryName = {
      'university': '🎓 Их сургууль',
      'hospital':   '🏥 Эмнэлэг',
      'school':     '🏫 Дунд сургууль',
      'shop':       '🛍️ Дэлгүүр'
    }[p.category] || p.category;

    const phone = p.phone ? `<div class="popup-row">📞 ${p.phone}</div>` : '';
    const website = p.website ? `<a class="popup-link" href="${p.website}" target="_blank">🌐 Вэбсайт →</a>` : '';

    new maplibregl.Popup({ maxWidth: '300px', offset: 15 })
      .setLngLat(e.lngLat)
      .setHTML(`
        <div class="popup-title">${p.name}</div>
        <div class="popup-category">${categoryName}</div>
        <div class="popup-row">📍 ${p.address}</div>
        ${phone}
        <div class="popup-desc">${p.description || ''}</div>
        ${website}
      `)
      .addTo(map);
  });

  map.on('mouseenter', 'places-circle', () => {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'places-circle', () => {
    map.getCanvas().style.cursor = '';
  });
});

  map.addLayer({
    id: 'uni-circle',
    type: 'circle',
    source: 'universities',
    'source-layer': 'universities',
    paint: {
      'circle-radius': 12,
      'circle-color': '#1a73e8',
      'circle-stroke-width': 3,
      'circle-stroke-color': '#ffffff',
      'circle-opacity': 0.9
    }
  });

  map.addLayer({
    id: 'uni-label',
    type: 'symbol',
    source: 'universities',
    'source-layer': 'universities',
    layout: {
      'text-field': ['get', 'name_short'],
      'text-size': 12,
      'text-offset': [0, 1.8],
      'text-anchor': 'top',
      'text-font': ['Noto Sans Regular']
    },
    paint: {
      'text-color': '#1a1a2e',
      'text-halo-color': '#ffffff',
      'text-halo-width': 2
    }
  });

  map.on('click', 'uni-circle', (e) => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ maxWidth: '280px', offset: 15 })
      .setLngLat(e.lngLat)
      .setHTML(`
        <div class="popup-title">${p.name}</div>
        <div class="popup-row">📍 ${p.address}</div>
        <div class="popup-row">👥 ${Number(p.students).toLocaleString()} оюутан</div>
        <a class="popup-link" href="${p.website}" target="_blank">🌐 Вэбсайт →</a>
      `)
      .addTo(map);
  });

  map.on('mouseenter', 'uni-circle', () => {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'uni-circle', () => {
    map.getCanvas().style.cursor = '';
  });
});
</script>
</body>
</html>
