<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Улаанбаатарын байгуулагууд</title>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; }
#map { width: 100vw; height: 100vh; }
.maplibregl-popup-content { padding: 14px; border-radius: 8px; min-width: 220px; }
.popup-title { font-weight: 700; font-size: 15px; color: #1a1a2e; margin-bottom: 6px; border-bottom: 2px solid #f0a500; padding-bottom: 5px; }
.popup-cat { font-size: 11px; color: #888; margin-bottom: 6px; }
.popup-row { font-size: 12px; color: #555; margin: 3px 0; }
.popup-desc { font-size: 12px; color: #666; margin-top: 6px; font-style: italic; }
.popup-link { display: inline-block; margin-top: 8px; color: #1a73e8; font-size: 13px; text-decoration: none; }
#legend {
  position: absolute; bottom: 30px; left: 10px; z-index: 999;
  background: rgba(255,255,255,0.95); padding: 12px 16px; border-radius: 8px;
  font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #999; }
</style>
</head>
<body>
<div id="map"></div>
<div id="legend"></div>
<script>
var API = 'https://amka-api.onrender.com';
var cats = [];

var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { osm: {
      type: 'raster',
      tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256, maxzoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }},
    layers: [{ id:'osm-base', type:'raster', source:'osm' }]
  },
  center: [106.9057, 47.9184],
  zoom: 13
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

// Зургийг MapLibre-д бүртгэх
function loadIcon(code, dataUrl) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var size = 128;
      var canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext('2d');

      // Цагаан дугуй суурь
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2 - 1, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#cccccc';
      ctx.stroke();

      // Зургийг голлуулж байрлуулах
      var pad = 22;
      var maxW = size - pad * 2;
      var scale = Math.min(maxW / img.width, maxW / img.height);
      var w = img.width * scale;
      var h = img.height * scale;
      ctx.drawImage(img, (size - w)/2, (size - h)/2, w, h);

      var id = 'icon-' + code;
      if (map.hasImage(id)) map.removeImage(id);
      map.addImage(id, ctx.getImageData(0, 0, size, size), { pixelRatio: 2 });
      resolve(true);
    };
    img.onerror = function() { resolve(false); };
    img.src = dataUrl;
  });
}

map.on('load', function() {

  fetch(API + '/categories?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(list) {
      cats = list;
      buildLegend();

      var jobs = cats
        .filter(function(c) { return c.icon; })
        .map(function(c) { return loadIcon(c.code, c.icon); });

      return Promise.all(jobs);
    })
    .then(function() {
      return fetch(API + '/places?t=' + Date.now());
    })
    .then(function(r) { return r.json(); })
    .then(function(gj) {

      map.addSource('places', { type: 'geojson', data: gj });

      var withIcon  = cats.filter(function(c) { return c.icon; }).map(function(c) { return c.code; });
      var noIcon    = cats.filter(function(c) { return !c.icon; }).map(function(c) { return c.code; });

      // Дүрсгүй ангилалд өнгөт дугуй
      if (noIcon.length > 0) {
        var colorExpr = ['match', ['get','category']];
        cats.forEach(function(c) { if (!c.icon) colorExpr.push(c.code, c.color); });
        colorExpr.push('#888888');

        map.addLayer({
          id: 'places-circle',
          type: 'circle',
          source: 'places',
          filter: ['!', ['in', ['get','category'], ['literal', withIcon]]],
          paint: {
            'circle-radius': 11,
            'circle-color': colorExpr,
            'circle-stroke-width': 2.5,
            'circle-stroke-color': '#ffffff'
          }
        });
      }

      // Дүрстэй ангилалд зураг
      if (withIcon.length > 0) {
        var iconExpr = ['match', ['get','category']];
        cats.forEach(function(c) { if (c.icon) iconExpr.push(c.code, 'icon-' + c.code); });
        iconExpr.push('');

        map.addLayer({
          id: 'places-icon',
          type: 'symbol',
          source: 'places',
          filter: ['in', ['get','category'], ['literal', withIcon]],
          layout: {
            'icon-image': iconExpr,
            'icon-size': 0.4,
            'icon-allow-overlap': true,
            'icon-ignore-placement': true
          }
        });
      }

      var layerIds = [];
      if (map.getLayer('places-circle')) layerIds.push('places-circle');
      if (map.getLayer('places-icon'))   layerIds.push('places-icon');

      layerIds.forEach(function(lid) {
        map.on('click', lid, function(e) {
          var p = e.features[0].properties;
          var c = cats.find(function(x) { return x.code === p.category; });
          var catLabel = c ? c.name : p.category;
          var phone = p.phone ? '<div class="popup-row">Утас: ' + p.phone + '</div>' : '';
          var web = p.website ? '<a class="popup-link" href="' + p.website + '" target="_blank">Вэбсайт</a>' : '';
          var desc = p.description ? '<div class="popup-desc">' + p.description + '</div>' : '';

          new maplibregl.Popup({ maxWidth: '300px', offset: 15 })
            .setLngLat(e.lngLat)
            .setHTML(
              '<div class="popup-title">' + p.name + '</div>' +
              '<div class="popup-cat">' + catLabel + '</div>' +
              '<div class="popup-row">' + (p.address || '') + '</div>' +
              phone + desc + web
            )
            .addTo(map);
        });

        map.on('mouseenter', lid, function() { map.getCanvas().style.cursor = 'pointer'; });
        map.on('mouseleave', lid, function() { map.getCanvas().style.cursor = ''; });
      });
    })
    .catch(function(e) { console.error('Ачаалахад алдаа:', e); });
});

function buildLegend() {
  var el = document.getElementById('legend');
  el.innerHTML =
    '<div style="font-weight:600;margin-bottom:7px;font-size:12px">Ангилал</div>' +
    cats.map(function(c) {
      var mark = c.icon
        ? '<img src="' + c.icon + '" style="width:16px;height:16px;object-fit:contain">'
        : '<div class="legend-dot" style="background:' + c.color + '"></div>';
      return '<div class="legend-item" data-code="' + c.code + '">' + mark + c.name + '</div>';
    }).join('') +
    '<div class="legend-item" data-code="" style="margin-top:6px;border-top:1px solid #ddd;padding-top:6px">Бүгдийг харах</div>';

  el.querySelectorAll('.legend-item').forEach(function(it) {
    it.style.cursor = 'pointer';
    it.onclick = function() {
      var code = it.dataset.code;
      var withIcon = cats.filter(function(c) { return c.icon; }).map(function(c) { return c.code; });

      if (map.getLayer('places-circle')) {
        var base = ['!', ['in', ['get','category'], ['literal', withIcon]]];
        map.setFilter('places-circle',
          code ? ['all', base, ['==', ['get','category'], code]] : base);
      }
      if (map.getLayer('places-icon')) {
        var baseI = ['in', ['get','category'], ['literal', withIcon]];
        map.setFilter('places-icon',
          code ? ['all', baseI, ['==', ['get','category'], code]] : baseI);
      }
    };
  });
}
</script>
</body>
</html>
