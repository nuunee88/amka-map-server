<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — amka.mn</title>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;display:flex;height:100vh;overflow:hidden}
#map{flex:1}
#panel{width:380px;background:#f7f7f7;display:flex;flex-direction:column;border-left:1px solid #ddd}
#keyBar{padding:10px 14px;background:#1a1a2e;display:flex;gap:8px;align-items:center}
#keyBar input{flex:1;padding:6px 8px;border:none;border-radius:4px;font-size:12px}
#keyBar span{color:#0f0;font-size:11px;font-family:monospace}
.tabs{display:flex;background:#e8e8e8;border-bottom:1px solid #ccc}
.tab{flex:1;padding:11px 6px;text-align:center;cursor:pointer;font-size:13px;color:#666;border-bottom:2px solid transparent}
.tab.on{background:#f7f7f7;color:#1a73e8;border-bottom-color:#1a73e8;font-weight:600}
.tc{display:none;flex:1;overflow-y:auto;padding:14px}
.tc.on{display:block}
h3{font-size:14px;margin-bottom:10px;color:#1a1a2e}
label{display:block;font-size:11px;color:#666;margin:8px 0 3px}
input,select,textarea{width:100%;padding:7px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:inherit}
textarea{height:55px;resize:vertical}
button{padding:9px;border:none;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit}
.primary{width:100%;background:#1a73e8;color:#fff;margin-top:12px}
.primary:disabled{background:#aaa;cursor:not-allowed}
.hint{background:#fff3cd;border:1px solid #ffe08a;padding:9px;border-radius:4px;font-size:12px;margin-bottom:10px;line-height:1.5}
.coord{background:#fff;border:1px solid #ddd;padding:7px;border-radius:4px;font-family:monospace;font-size:11px;margin-top:6px}
#msg{margin-top:10px;padding:9px;border-radius:4px;font-size:12px;display:none;line-height:1.5}
.ok{background:#d4edda;color:#155724}
.err{background:#f8d7da;color:#721c24}
.item{background:#fff;border:1px solid #ddd;border-radius:5px;padding:9px 11px;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb;flex-shrink:0}
.dot img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.item-body{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:600;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:11px;color:#888;margin-top:1px}
.btn-sm{padding:4px 9px;font-size:11px;border-radius:3px}
.edit{background:#1a73e8;color:#fff}
.del{background:#e53935;color:#fff}
.filter{width:100%;margin-bottom:10px}
.icon-prev{width:36px;height:36px;border:1px solid #ddd;border-radius:5px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.icon-prev img{max-width:100%;max-height:100%}
.icon-row{display:flex;gap:9px;align-items:center;margin-top:5px}
.color-row{display:flex;gap:8px;align-items:center;margin-top:5px}
.color-row input[type=color]{width:44px;height:34px;padding:2px;cursor:pointer}
.divider{border-top:1px solid #ddd;margin:14px 0}
.cat-form{background:#fff;border:1px solid #ddd;border-radius:5px;padding:12px;margin-bottom:14px}
.warn-box{background:#f8d7da;border:1px solid #f5c2c7;border-radius:5px;padding:11px;margin-top:9px;font-size:12px;line-height:1.6;color:#721c24}
.warn-box ul{margin:7px 0 0 17px}
.row2{display:flex;gap:8px}
.row2>div{flex:1}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">

  <div id="keyBar">
    <input type="password" id="adminKey" placeholder="Админ нууц үг">
    <span id="keyState">•</span>
  </div>

  <div class="tabs">
    <div class="tab on" data-t="add">Цэг нэмэх</div>
    <div class="tab" data-t="list">Цэгүүд</div>
    <div class="tab" data-t="cat">Ангилал</div>
  </div>

  <!-- ЦЭГ НЭМЭХ / ЗАСАХ -->
  <div class="tc on" id="tc-add">
    <h3 id="formTitle">Шинэ цэг нэмэх</h3>
    <div class="hint">Газрын зураг дээр дарж байршил сонгоно уу.</div>
    <div class="coord" id="coord">Байршил сонгоогүй</div>

    <label>Нэр *</label>
    <input type="text" id="f_name">

    <label>Товч нэр</label>
    <input type="text" id="f_short">

    <label>Ангилал</label>
    <select id="f_cat"></select>

    <label>Хаяг</label>
    <input type="text" id="f_addr">

    <div class="row2">
      <div>
        <label>Утас</label>
        <input type="text" id="f_phone">
      </div>
      <div>
        <label>Вэбсайт</label>
        <input type="text" id="f_web">
      </div>
    </div>

    <label>Тайлбар</label>
    <textarea id="f_desc"></textarea>

    <button class="primary" id="saveBtn" disabled>Хадгалах</button>
    <button class="primary" id="cancelBtn" style="background:#888;display:none">Цуцлах</button>
    <div id="msg"></div>
  </div>

  <!-- ЦЭГҮҮД -->
  <div class="tc" id="tc-list">
    <h3>Бүртгэлтэй цэгүүд</h3>
    <select class="filter" id="listFilter"><option value="">Бүх ангилал</option></select>
    <div id="placeList">Ачаалж байна...</div>
  </div>

  <!-- АНГИЛАЛ -->
  <div class="tc" id="tc-cat">
    <h3 id="catFormTitle">Шинэ ангилал</h3>
    <div class="cat-form">
      <label>Код * <span style="color:#aaa">(латин, ж: cafe)</span></label>
      <input type="text" id="c_code">

      <label>Нэр *</label>
      <input type="text" id="c_name">

      <label>Өнгө</label>
      <div class="color-row">
        <input type="color" id="c_color" value="#888888">
        <input type="text" id="c_colorTxt" value="#888888">
      </div>

      <label>Дүрс (PNG/SVG, 100KB хүртэл)</label>
      <div class="icon-row">
        <div class="icon-prev" id="c_iconPrev">—</div>
        <input type="file" id="c_iconFile" accept="image/png,image/svg+xml,image/jpeg" style="font-size:11px">
        <button class="btn-sm del" id="c_iconClear">×</button>
      </div>

      <label>Эрэмбэ</label>
      <input type="number" id="c_order" value="50">

      <button class="primary" id="catSaveBtn">Ангилал хадгалах</button>
      <button class="primary" id="catCancelBtn" style="background:#888;display:none">Цуцлах</button>
    </div>

    <div id="catMsg"></div>
    <div class="divider"></div>
    <h3>Ангилалууд</h3>
    <div id="catList">Ачаалж байна...</div>
  </div>

</div>

<script>
var API = 'https://amka-api.onrender.com';
var picked = null, tempMarker = null;
var editId = null, editCatId = null;
var cats = [];

var keyEl = document.getElementById('adminKey');
keyEl.value = localStorage.getItem('amka_key') || '';
keyEl.onchange = function(){ localStorage.setItem('amka_key', this.value); };
function K(){ return keyEl.value; }

/* ─── Табууд ─── */
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick = function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.tc').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on');
    document.getElementById('tc-' + t.dataset.t).classList.add('on');
  };
});

/* ─── Газрын зураг ─── */
var map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: { osm: {
      type: 'raster',
      tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
      tileSize: 256, maxzoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }},
    layers: [{ id: 'osm-base', type: 'raster', source: 'osm' }]
  },
  center: [106.9057, 47.9184],
  zoom: 13
});
map.addControl(new maplibregl.NavigationControl(), 'top-right');

map.on('load', function(){
  map.addSource('places', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });

  map.addLayer({
    id:'places-circle', type:'circle', source:'places',
    paint:{ 'circle-radius':9, 'circle-color':'#888',
            'circle-stroke-width':2, 'circle-stroke-color':'#fff' }
  });

  map.addLayer({
    id:'places-icon', type:'symbol', source:'places',
    layout:{ 'icon-image':'', 'icon-size':0.9,
             'icon-allow-overlap':true, 'icon-ignore-placement':true }
  });

  loadAll();
});

map.on('click', function(e){
  if (e.defaultPrevented) return;
  picked = { lng: e.lngLat.lng, lat: e.lngLat.lat };
  document.getElementById('coord').textContent =
    'lng ' + picked.lng.toFixed(6) + '   lat ' + picked.lat.toFixed(6);
  document.getElementById('saveBtn').disabled = false;
  if (tempMarker) tempMarker.remove();
  tempMarker = new maplibregl.Marker({ color:'#f0a500' })
    .setLngLat([picked.lng, picked.lat]).addTo(map);
});

function loadIcon(code, dataUrl) {
  return new Promise(function(resolve) {
    var img = new Image();
    img.onload = function() {
      var size = 48;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2 - 1, 0, Math.PI*2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#cccccc'; ctx.stroke();
      var pad = 9, maxW = size - pad*2;
      var scale = Math.min(maxW/img.width, maxW/img.height);
      var w = img.width*scale, h = img.height*scale;
      ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
      var id = 'icon-' + code;
      if (map.hasImage(id)) map.removeImage(id);
      map.addImage(id, ctx.getImageData(0,0,size,size), { pixelRatio: 2 });
      resolve(true);
    };
    img.onerror = function(){ resolve(false); };
    img.src = dataUrl;
  });
}

/* ─── Мессеж ─── */
function msg(el, text, ok){
  var m = document.getElementById(el);
  m.innerHTML = text;
  m.className = ok ? 'ok' : 'err';
  m.style.display = 'block';
  if (ok) setTimeout(function(){ m.style.display='none'; }, 4000);
}
  
function applyStyles(){
  if (!map.getLayer('places-circle')) return;

  var withIcon = cats.filter(function(c){ return c.icon; }).map(function(c){ return c.code; });

  var colorExpr = ['match', ['get','category']];
  cats.forEach(function(c){ colorExpr.push(c.code, c.color); });
  colorExpr.push('#888888');
  map.setPaintProperty('places-circle', 'circle-color', colorExpr);

  if (withIcon.length > 0) {
    map.setFilter('places-circle', ['!', ['in', ['get','category'], ['literal', withIcon]]]);
    map.setFilter('places-icon',   ['in', ['get','category'], ['literal', withIcon]]);
    var iconExpr = ['match', ['get','category']];
    cats.forEach(function(c){ if (c.icon) iconExpr.push(c.code, 'icon-' + c.code); });
    iconExpr.push('');
    map.setLayoutProperty('places-icon', 'icon-image', iconExpr);
  } else {
    map.setFilter('places-circle', null);
    map.setFilter('places-icon', ['==', ['get','category'], '___none___']);
  }
}

/* ─── Өгөгдөл ачаалах ─── */
function loadAll(){
  fetch(API + '/categories?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(list){
      cats = list;
      renderCatSelects();
      renderCatList();
      var jobs = cats.filter(function(c){ return c.icon; })
                     .map(function(c){ return loadIcon(c.code, c.icon); });
      return Promise.all(jobs);
    })
    .then(function(){
      applyStyles();
      return fetch(API + '/places?t=' + Date.now());
    })
    .then(function(r){ return r.json(); })
    .then(function(gj){
      if (map.getSource('places')) map.getSource('places').setData(gj);
      renderPlaceList(gj);
    })
    .catch(function(e){ msg('msg', 'Ачаалахад алдаа: ' + e.message, false); });
}

function catName(code){
  var c = cats.find(function(x){ return x.code === code; });
  return c ? c.name : code;
}
function catColor(code){
  var c = cats.find(function(x){ return x.code === code; });
  return c ? c.color : '#888888';
}
function catIcon(code){
  var c = cats.find(function(x){ return x.code === code; });
  return c && c.icon ? c.icon : null;
}

function renderCatSelects(){
  var opts = cats.map(function(c){
    return '<option value="'+c.code+'">'+c.name+'</option>';
  }).join('');
  document.getElementById('f_cat').innerHTML = opts;
  document.getElementById('listFilter').innerHTML =
    '<option value="">Бүх ангилал</option>' +
    cats.map(function(c){
      return '<option value="'+c.code+'">'+c.name+' ('+c.place_count+')</option>';
    }).join('');
}

/* ─── Цэгийн жагсаалт ─── */
var allPlaces = [];
function renderPlaceList(gj){
  allPlaces = gj.features || [];
  drawPlaceList();
}
document.getElementById('listFilter').onchange = drawPlaceList;

function drawPlaceList(){
  var f = document.getElementById('listFilter').value;
  var arr = f ? allPlaces.filter(function(x){ return x.properties.category === f; }) : allPlaces;
  var el = document.getElementById('placeList');
  if (arr.length === 0){ el.innerHTML = '<div style="font-size:12px;color:#888">Цэг байхгүй</div>'; return; }
  el.innerHTML = arr.map(function(x){
    var p = x.properties;
    var ic = catIcon(p.category);
    var dot = ic
      ? '<div class="dot"><img src="'+ic+'"></div>'
      : '<div class="dot" style="background:'+catColor(p.category)+'"></div>';
    return '<div class="item">' + dot +
      '<div class="item-body"><div class="item-name">'+p.name+'</div>' +
      '<div class="item-sub">'+catName(p.category)+'</div></div>' +
      '<button class="btn-sm edit" onclick="editPlace('+p.id+')">Засах</button>' +
      '<button class="btn-sm del" onclick="delPlace('+p.id+')">×</button></div>';
  }).join('');
}

/* ─── Цэг нэмэх / засах ─── */
function resetForm(){
  editId = null; picked = null;
  if (tempMarker){ tempMarker.remove(); tempMarker = null; }
  ['f_name','f_short','f_addr','f_phone','f_web','f_desc'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('coord').textContent = 'Байршил сонгоогүй';
  document.getElementById('formTitle').textContent = 'Шинэ цэг нэмэх';
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('cancelBtn').style.display = 'none';
}
document.getElementById('cancelBtn').onclick = resetForm;

window.editPlace = function(id){
  var f = allPlaces.find(function(x){ return x.properties.id === id; });
  if (!f) return;
  var p = f.properties;
  editId = id;
  picked = { lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] };
  document.getElementById('f_name').value  = p.name || '';
  document.getElementById('f_short').value = p.name_short || '';
  document.getElementById('f_cat').value   = p.category || 'other';
  document.getElementById('f_addr').value  = p.address || '';
  document.getElementById('f_phone').value = p.phone || '';
  document.getElementById('f_web').value   = p.website || '';
  document.getElementById('f_desc').value  = p.description || '';
  document.getElementById('coord').textContent =
    'lng ' + picked.lng.toFixed(6) + '   lat ' + picked.lat.toFixed(6);
  document.getElementById('formTitle').textContent = 'Цэг засах (#' + id + ')';
  document.getElementById('saveBtn').disabled = false;
  document.getElementById('cancelBtn').style.display = 'block';
  if (tempMarker) tempMarker.remove();
  tempMarker = new maplibregl.Marker({ color:'#f0a500' })
    .setLngLat([picked.lng, picked.lat]).addTo(map);
  map.flyTo({ center:[picked.lng, picked.lat], zoom: 16 });
  document.querySelector('.tab[data-t=add]').click();
};

document.getElementById('saveBtn').onclick = function(){
  if (!K()){ msg('msg','Нууц үг оруулна уу',false); return; }
  var name = document.getElementById('f_name').value.trim();
  if (!name){ msg('msg','Нэр шаардлагатай',false); return; }
  if (!picked){ msg('msg','Байршил сонгоно уу',false); return; }

  var body = {
    name: name,
    name_short: document.getElementById('f_short').value.trim(),
    category: document.getElementById('f_cat').value,
    address: document.getElementById('f_addr').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    website: document.getElementById('f_web').value.trim(),
    description: document.getElementById('f_desc').value.trim(),
    lng: picked.lng, lat: picked.lat
  };

  var btn = this; btn.disabled = true; btn.textContent = 'Хадгалж байна...';
  fetch(API + '/places' + (editId ? '/' + editId : ''), {
    method: editId ? 'PUT' : 'POST',
    headers: { 'Content-Type':'application/json', 'x-admin-key': K() },
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
  .then(function(res){
    btn.textContent = 'Хадгалах';
    if (res.ok){ msg('msg','Амжилттай', true); resetForm(); loadAll(); }
    else { msg('msg','Алдаа: ' + (res.d.error||''), false); btn.disabled = false; }
  })
  .catch(function(e){
    btn.textContent = 'Хадгалах'; btn.disabled = false;
    msg('msg','Сүлжээний алдаа: ' + e.message, false);
  });
};

window.delPlace = function(id){
  if (!K()){ msg('msg','Нууц үг оруулна уу',false); return; }
  if (!confirm('Энэ цэгийг устгах уу?')) return;
  fetch(API + '/places/' + id, { method:'DELETE', headers:{'x-admin-key':K()} })
    .then(function(r){
      if (r.ok){ msg('msg','Устгалаа', true); loadAll(); }
      else msg('msg','Устгаж чадсангүй', false);
    });
};

/* ─── Ангилал ─── */
var iconData = null;

document.getElementById('c_color').oninput = function(){
  document.getElementById('c_colorTxt').value = this.value;
};
document.getElementById('c_colorTxt').oninput = function(){
  if (/^#[0-9a-fA-F]{6}$/.test(this.value)) document.getElementById('c_color').value = this.value;
};

document.getElementById('c_iconFile').onchange = function(){
  var file = this.files[0];
  if (!file) return;
  if (file.size > 100*1024){
    msg('catMsg','Зураг 100KB-аас бага байх ёстой', false);
    this.value = ''; return;
  }
  var fr = new FileReader();
  fr.onload = function(){
    iconData = fr.result;
    document.getElementById('c_iconPrev').innerHTML = '<img src="'+iconData+'">';
  };
  fr.readAsDataURL(file);
};

document.getElementById('c_iconClear').onclick = function(){
  iconData = null;
  document.getElementById('c_iconFile').value = '';
  document.getElementById('c_iconPrev').innerHTML = '—';
};

function resetCatForm(){
  editCatId = null; iconData = null;
  document.getElementById('c_code').value = '';
  document.getElementById('c_code').disabled = false;
  document.getElementById('c_name').value = '';
  document.getElementById('c_color').value = '#888888';
  document.getElementById('c_colorTxt').value = '#888888';
  document.getElementById('c_order').value = 50;
  document.getElementById('c_iconFile').value = '';
  document.getElementById('c_iconPrev').innerHTML = '—';
  document.getElementById('catFormTitle').textContent = 'Шинэ ангилал';
  document.getElementById('catSaveBtn').textContent = 'Ангилал хадгалах';
  document.getElementById('catCancelBtn').style.display = 'none';
}
document.getElementById('catCancelBtn').onclick = resetCatForm;

function renderCatList(){
  var el = document.getElementById('catList');
  el.innerHTML = cats.map(function(c){
    var dot = c.icon
      ? '<div class="dot"><img src="'+c.icon+'"></div>'
      : '<div class="dot" style="background:'+c.color+'"></div>';
    return '<div class="item">' + dot +
      '<div class="item-body"><div class="item-name">'+c.name+'</div>' +
      '<div class="item-sub">'+c.code+' · '+c.place_count+' цэг</div></div>' +
      '<button class="btn-sm edit" onclick="editCat('+c.id+')">Засах</button>' +
      '<button class="btn-sm del" onclick="delCat('+c.id+')">×</button></div>';
  }).join('');
}

window.editCat = function(id){
  var c = cats.find(function(x){ return x.id === id; });
  if (!c) return;
  editCatId = id;
  iconData = c.icon || null;
  document.getElementById('c_code').value = c.code;
  document.getElementById('c_code').disabled = true;
  document.getElementById('c_name').value = c.name;
  document.getElementById('c_color').value = c.color;
  document.getElementById('c_colorTxt').value = c.color;
  document.getElementById('c_order').value = c.sort_order;
  document.getElementById('c_iconPrev').innerHTML = c.icon ? '<img src="'+c.icon+'">' : '—';
  document.getElementById('catFormTitle').textContent = 'Ангилал засах';
  document.getElementById('catSaveBtn').textContent = 'Өөрчлөлт хадгалах';
  document.getElementById('catCancelBtn').style.display = 'block';
};

document.getElementById('catSaveBtn').onclick = function(){
  if (!K()){ msg('catMsg','Нууц үг оруулна уу',false); return; }
  var code = document.getElementById('c_code').value.trim();
  var name = document.getElementById('c_name').value.trim();
  if (!code || !name){ msg('catMsg','Код болон нэр шаардлагатай',false); return; }

  var body = {
    code: code, name: name,
    color: document.getElementById('c_colorTxt').value,
    icon: iconData,
    sort_order: parseInt(document.getElementById('c_order').value) || 50
  };

  var btn = this; btn.disabled = true;
  fetch(API + '/categories' + (editCatId ? '/' + editCatId : ''), {
    method: editCatId ? 'PUT' : 'POST',
    headers: { 'Content-Type':'application/json', 'x-admin-key': K() },
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
  .then(function(res){
    btn.disabled = false;
    if (res.ok){ msg('catMsg','Амжилттай', true); resetCatForm(); loadAll(); }
    else msg('catMsg','Алдаа: ' + (res.d.error||''), false);
  })
  .catch(function(e){ btn.disabled = false; msg('catMsg','Алдаа: '+e.message, false); });
};

window.delCat = function(id){
  if (!K()){ msg('catMsg','Нууц үг оруулна уу',false); return; }
  if (!confirm('Энэ ангилалыг устгах уу?')) return;

  fetch(API + '/categories/' + id, { method:'DELETE', headers:{'x-admin-key':K()} })
    .then(function(r){ return r.json().then(function(d){ return {st:r.status,d:d}; }); })
    .then(function(res){
      if (res.st === 200){ msg('catMsg','Устгалаа', true); loadAll(); }
      else if (res.st === 409){
        var html = '<b>Устгах боломжгүй</b><br>Энэ ангилалд <b>' + res.d.count +
                   '</b> цэг бүртгэлтэй байна:<ul>' +
                   res.d.places.map(function(p){ return '<li>'+p.name+'</li>'; }).join('') +
                   '</ul>Эдгээр цэгийн ангилалыг эхлээд өөрчилнө үү.';
        msg('catMsg', html, false);
      }
      else msg('catMsg','Алдаа: ' + (res.d.error||''), false);
    });
};
</script>
</body>
